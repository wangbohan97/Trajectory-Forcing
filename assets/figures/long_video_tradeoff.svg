 <title id="tradeoff-title">30-second video: frame quality versus temporal quality</title><desc id="tradeoff-desc">Six paper-reported comparisons. Horizontal axis: Frame Quality, 58 to 68. Vertical axis: Temporal Quality, 80 to 92. Both higher-is-better; axes are zoomed. Hollow gray markers are Rolling Forcing and LongLive, which use long-video-specific training. Labels show Frame Quality followed by Temporal Quality. CausVid: 62.66, 83.97; Causal Forcing: 59.58, 89.26; Self Forcing: 61.49, 85.35; Trajectory Forcing: 65.46, 90.39; Rolling Forcing: 65.36, 82.04; LongLive: 66.07, 81.33.</desc><metadata>
